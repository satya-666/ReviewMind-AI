# Preparation only. Importing this Blueprint creates paid resources and requires owner approval.
services:
  - type: web
    name: reviewmind-api
    runtime: docker
    plan: 0.5c-512mb
    region: singapore
    branch: phase-3.5/web-integration
    autoDeployTrigger: 'off'
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: AUTO_CREATE_DB
        value: 'false'
      - key: MODEL_PATH
        value: /app/runtime/model.joblib
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: RATE_LIMIT_PER_MINUTE
        value: '20'
      - key: GLOBAL_RATE_LIMIT_PER_MINUTE
        value: '120'
      - key: DATABASE_URL
        fromDatabase:
          name: reviewmind-feedback
          property: connectionString
  - type: web
    name: reviewmind-ui
    runtime: static
    branch: phase-3.5/web-integration
    autoDeployTrigger: 'off'
    buildCommand: node scripts/build_frontend.mjs
    staticPublishPath: ./frontend
    envVars:
      - key: SKIP_INSTALL_DEPS
        value: 'true'
      - key: FRONTEND_API_URL
        sync: false
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /assets/config.js
        name: Cache-Control
        value: no-store
databases:
  - name: reviewmind-feedback
    plan: 0.1c-256mb
    region: singapore
    diskSizeGB: 1
    storageAutoscalingEnabled: false
    ipAllowList: []
